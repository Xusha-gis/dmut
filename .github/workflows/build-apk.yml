name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK ni sozlash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Unit testlar
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Debug APK yig'ish
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Debug APK ni imzolash (v1+v2) va tekshirish
        run: |
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.jks" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/debug.jks" \
            --ks-pass:pass:android --key-pass:pass:android \
            --v1-signing-enabled true --v2-signing-enabled true \
            app/build/outputs/apk/debug/app-debug.apk
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Debug APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: documate-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Keystore ni tayyorlash
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Release APK yig'ish (imzolangan)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Release APK ni yuklash
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: documate-release-apk
          path: app/build/outputs/apk/release/*.apk
